name: Deploy — EliteDev

on:
  # Run after CI completes successfully on master
  workflow_run:
    workflows: ["CI — EliteDev"]
    types: [completed]
    branches: [master]

  # Also run on PRs for preview (only if CI passed)
  pull_request:
    branches: [master, main]

# Only allow one deployment at a time per branch
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  # ── Preview deployment (PRs only, after CI passes) ────────────────────────
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Verify CI passed
      if: github.event_name == 'pull_request'
      run: |
        echo "PR deployment — CI checks should be green"

    - name: Install Vercel CLI
      run: npm install -g vercel@latest

    - name: Enable pnpm
      run: |
        corepack enable
        pnpm --version

    - name: Pull Vercel environment
      run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

    - name: Build with staging Supabase
      run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      env:
        # ── Staging Supabase (preview deployments use staging) ──
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_KEY }}
        NEXT_PUBLIC_APP_URL: ${{ steps.deploy.outputs.url || 'http://localhost:3000' }}
        # ── Preview-specific settings ──
        LOG_LEVEL: info
        PERF_LOG_THRESHOLD_MS: 2000
        NODE_ENV: production

    - name: Deploy preview
      id: deploy
      run: |
        URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
        echo "url=$URL" >> "$GITHUB_OUTPUT"
        echo "🔗 Preview URL: $URL"

    - name: Smoke test preview
      run: |
        if [ -n "${{ steps.deploy.outputs.url }}" ]; then
          sleep 10
          echo "Testing preview: ${{ steps.deploy.outputs.url }}"

          # Health check
          HEALTH=$(curl -s "${{ steps.deploy.outputs.url }}/api/health" 2>/dev/null || echo "{}")
          echo "Health: $HEALTH"

          if echo "$HEALTH" | grep -q '"status":"healthy"\|"status":"degraded"'; then
            echo "✅ Preview health check passed"
          else
            echo "⚠️ Preview health check returned unexpected response"
          fi

          # Auth boundary
          REDIRECT=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.deploy.outputs.url }}/dashboard" 2>/dev/null || echo "000")
          if [ "$REDIRECT" = "307" ] || [ "$REDIRECT" = "302" ] || [ "$REDIRECT" = "401" ]; then
            echo "✅ Auth boundary working (redirect $REDIRECT)"
          else
            echo "⚠️ Auth boundary returned $REDIRECT"
          fi
        fi

  # ── Production deployment (master only, after CI passes) ──────────────────
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'master'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Verify CI succeeded
      run: |
        echo "CI workflow completed successfully — proceeding with production deployment"
        echo "CI run: ${{ github.event.workflow_run.html_url }}"

    - name: Verify production Supabase secrets
      env:
        PRODUCTION_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
        PRODUCTION_SUPABASE_ANON_KEY: ${{ secrets.PRODUCTION_SUPABASE_ANON_KEY }}
        PRODUCTION_SUPABASE_SERVICE_KEY: ${{ secrets.PRODUCTION_SUPABASE_SERVICE_KEY }}
        STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      run: |
        # Secrets are passed through env: and read as shell variables.
        # Never interpolate secrets directly into a run: block -- Actions
        # substitutes the raw value into the script text, so any value
        # containing shell metacharacters becomes executable code.
        missing=0
        for var in PRODUCTION_SUPABASE_URL PRODUCTION_SUPABASE_ANON_KEY PRODUCTION_SUPABASE_SERVICE_KEY; do
          if [ -z "${!var}" ]; then
            echo "MISSING: $var is not configured"
            missing=1
          fi
        done
        if [ "$missing" -ne 0 ]; then
          echo "   Add the PRODUCTION_SUPABASE_* secrets to"
          echo "   GitHub -> Settings -> Environments -> production"
          echo "   See docs/P0-1-production-supabase-runbook.md"
          exit 1
        fi

        # The entire point of P0-1: production must not be staging.
        if [ -n "$STAGING_SUPABASE_URL" ] && [ "$PRODUCTION_SUPABASE_URL" = "$STAGING_SUPABASE_URL" ]; then
          echo "REFUSING: PRODUCTION_SUPABASE_URL is identical to STAGING_SUPABASE_URL"
          echo "   This would reintroduce the P0-1 defect."
          exit 1
        fi

        echo "OK: production Supabase secrets present and distinct from staging"

    - name: Install Vercel CLI
      run: npm install -g vercel@latest

    - name: Enable pnpm
      run: |
        corepack enable
        pnpm --version

    - name: Pull Vercel environment
      run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

    - name: Build for production
      run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      env:
        # ── Production Supabase (production uses its own project) ──
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PRODUCTION_SUPABASE_ANON_KEY }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_SERVICE_KEY }}
        NEXT_PUBLIC_APP_URL: ${{ steps.deploy.outputs.url || 'https://app.elitedev.com.sa' }}
        # ── Production-specific settings ──
        SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
        SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        LOG_LEVEL: info
        PERF_LOG_THRESHOLD_MS: 1000
        NODE_ENV: production

    - name: Verify production bundle has no staging references
      env:
        STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      run: |
        if [ -z "$STAGING_SUPABASE_URL" ]; then
          echo "WARNING: STAGING_SUPABASE_URL not set - skipping bundle check"
          exit 0
        fi
        STAGING_HOST="$(printf '%s' "$STAGING_SUPABASE_URL" | sed -E 's#^https?://##; s#/.*$##')"
        if [ -n "$STAGING_HOST" ] && grep -rqF "$STAGING_HOST" .vercel/output; then
          echo "REFUSING: staging Supabase reference found in production bundle: $STAGING_HOST"
          echo "   Vercel production env may still hold staging values (runbook Step 5)."
          exit 1
        fi
        echo "OK: production bundle contains no staging Supabase references"

    - name: Deploy production
      id: deploy
      run: |
        URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
        echo "url=$URL" >> "$GITHUB_OUTPUT"
        echo "🚀 Production URL: $URL"

    - name: Post-deploy verification
      run: |
        sleep 15
        echo "Running post-deploy smoke tests..."

        # Health check
        HEALTH=$(curl -s "${{ steps.deploy.outputs.url }}/api/health" 2>/dev/null || echo "{}")
        echo "Health: $HEALTH"

        if echo "$HEALTH" | grep -q '"status":"healthy"'; then
          echo "✅ Health check passed"
        else
          echo "❌ Health check failed — consider rollback"
          exit 1
        fi

        # Security headers
        HEADERS=$(curl -s -I "${{ steps.deploy.outputs.url }}/landing" 2>/dev/null || echo "")
        if echo "$HEADERS" | grep -qi "x-frame-options"; then
          echo "✅ Security headers present"
        else
          echo "⚠️ Missing security headers"
        fi

        # Auth boundary
        REDIRECT=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.deploy.outputs.url }}/dashboard" 2>/dev/null || echo "000")
        if [ "$REDIRECT" = "307" ] || [ "$REDIRECT" = "302" ] || [ "$REDIRECT" = "401" ]; then
          echo "✅ Auth boundary working (redirect $REDIRECT)"
        else
          echo "⚠️ Auth boundary returned $REDIRECT"
        fi

        # Load test profiling (quick check)
        LOAD_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.deploy.outputs.url }}/api/load-test?scenario=dashboard" 2>/dev/null || echo "000")
        if [ "$LOAD_STATUS" = "200" ] || [ "$LOAD_STATUS" = "401" ]; then
          echo "✅ Load test endpoint accessible ($LOAD_STATUS)"
        else
          echo "⚠️ Load test endpoint returned $LOAD_STATUS"
        fi

        echo "🎉 Post-deploy verification complete"
