name: CI — EliteDev

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Code quality ──────────────────────────────────────────────────────

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: pnpm test

      # ── Build ─────────────────────────────────────────────────────────────

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      # ── Security gates ────────────────────────────────────────────────────

      - name: Dependency audit
        run: pnpm audit --audit-level=high
        # BLOCKING: high/critical vulnerabilities fail the build
        # Use `pnpm audit --audit-level=critical` for stricter gating

      - name: Secret scan
        run: |
          # Scan for accidentally committed secrets
          echo "Scanning for hardcoded secrets..."
          if grep -rn "SUPABASE_SERVICE_ROLE_KEY\|sk_live_\|sk_test_\|AKIA[A-Z0-9]\|password.*=.*['\"]" src/ --include="*.ts" --include="*.tsx" --include="*.js" --include="*.env*" 2>/dev/null | grep -v "test\|mock\|example\|\.test\.\|__mock__\|process\.env\|\.env\.example\|types\|interface\|Log\|redact\|REDACTED\|placeholder" | head -20; then
            echo "⚠️ Potential secrets found — review above output"
            exit 1
          fi
          echo "✅ No hardcoded secrets detected"

      - name: Check for sensitive files
        run: |
          # Ensure no .env files or secrets are committed
          if git ls-files | grep -E '\.env$|\.env\.local$|\.env\.production$|\.env\.development$'; then
            echo "❌ Environment files found in repository — these should not be committed"
            git ls-files | grep -E '\.env$|\.env\.local$|\.env\.production$|\.env\.development$'
            exit 1
          fi
          echo "✅ No environment files in repository"

      # ── Deployment smoke test ─────────────────────────────────────────────

      - name: Smoke test health endpoint
        run: |
          # Start the dev server in the background
          pnpm dev &
          DEV_PID=$!

          # Wait for server to be ready
          for i in $(seq 1 30); do
            if curl -s http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "✅ Dev server started"
              break
            fi
            sleep 2
          done

          # Run health check
          HEALTH=$(curl -s http://localhost:3000/api/health)
          echo "$HEALTH" | python3 -m json.tool 2>/dev/null || echo "$HEALTH"

          # Accept healthy or degraded (degraded is expected when Supabase
          # is not running — the important thing is the app starts and responds)
          if echo "$HEALTH" | grep -q '"status":"healthy"\|"status":"degraded"'; then
            echo "✅ Health check passed (app is running)"
          else
            echo "❌ Health check failed — app did not start"
            kill $DEV_PID 2>/dev/null || true
            exit 1
          fi

          # Kill dev server
          kill $DEV_PID 2>/dev/null || true
          wait $DEV_PID 2>/dev/null || true
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  # ── pgTAP RLS tests (runs after CI passes, needs Docker) ─────────────────
  pgtap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Supabase CLI
        run: |
          # Install Supabase CLI via npm (uses Docker under the hood)
          npm install -g supabase
          supabase --version

      - name: Start Supabase local stack
        run: |
          # Start Postgres + Auth + Storage + Realtime
          supabase start 2>&1 | tail -20
          echo "Supabase started successfully"

      - name: Wait for database
        run: |
          # Wait for Postgres to accept connections
          for i in $(seq 1 30); do
            if supabase db ping 2>/dev/null | grep -q "alive"; then
              echo "✅ Database is ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "❌ Database did not become ready"
              exit 1
            fi
            sleep 1
          done

      - name: Install pgTAP extension
        run: |
          # pgTAP is included in Supabase's Postgres image
          # Verify it's available
          supabase db execute -c "CREATE EXTENSION IF NOT EXISTS pgtap;" 2>&1
          echo "✅ pgTAP extension ready"

      - name: Apply migrations + seed
        run: |
          # Reset database, apply all 60 migrations, and seed test fixtures
          supabase db reset 2>&1 | tail -15
          echo "✅ All migrations + seed data applied"

      - name: Run pgTAP RLS tests
        run: |
          echo "═══════════════════════════════════════════════════════════"
          echo "  Running pgTAP RLS test suite"
          echo "═══════════════════════════════════════════════════════════"
          echo ""

          TOTAL=0
          PASSED=0
          FAILED=0

          for test_file in $(find supabase/tests -name "*.sql" -type f | sort); do
            filename=$(basename "$test_file")
            echo ""
            echo "▶ Running: $filename"
            echo "───────────────────────────────────────────────────────"

            OUTPUT=$(supabase db execute -f "$test_file" 2>&1)
            EXIT_CODE=$?

            if [ $EXIT_CODE -eq 0 ]; then
              # Parse pgTAP output
              TESTS_RUN=$(echo "$OUTPUT" | grep -oP '^\d+\.\.\d+' | head -1 | cut -d. -f2)
              FAILURES=$(echo "$OUTPUT" | grep -c "^not ok" || true)

              if [ -n "$TESTS_RUN" ]; then
                TOTAL=$((TOTAL + TESTS_RUN))
                if [ "$FAILURES" -eq 0 ]; then
                  PASSED=$((PASSED + TESTS_RUN))
                  echo "  ✅ $filename — $TESTS_RUN/$TESTS_RUN passed"
                else
                  PASSED=$((PASSED + TESTS_RUN - FAILURES))
                  FAILED=$((FAILED + FAILURES))
                  echo "  ❌ $filename — $FAILURES failures in $TESTS_RUN tests"
                  echo "$OUTPUT" | grep -E "^not ok|^#.*FAIL" | head -5
                fi
              else
                TOTAL=$((TOTAL + 1))
                PASSED=$((PASSED + 1))
                echo "  ✅ $filename — completed"
              fi

              # Show errors if any
              if echo "$OUTPUT" | grep -q "ERROR\|exception\|EXCEPTION"; then
                echo "  ⚠️ Errors detected:"
                echo "$OUTPUT" | grep -i "error\|exception" | head -5
              fi
            else
              TOTAL=$((TOTAL + 1))
              FAILED=$((FAILED + 1))
              echo "  ❌ $filename — execution failed (exit code $EXIT_CODE)"
              echo "$OUTPUT" | tail -10
            fi
          done

          echo ""
          echo "═══════════════════════════════════════════════════════════"
          echo "  pgTAP Results: $PASSED/$TOTAL passed, $FAILED failed"
          echo "═══════════════════════════════════════════════════════════"

          if [ "$FAILED" -gt 0 ]; then
            echo "❌ Some pgTAP tests failed"
            exit 1
          else
            echo "✅ All pgTAP tests passed"
          fi

      - name: Stop Supabase
        if: always()
        run: supabase stop 2>/dev/null || true

  # ── E2E tests (runs on PRs only, needs staging env) ───────────────────────
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: ci
    if: github.event_name == 'pull_request'
    env:
      BASE_URL: ${{ secrets.STAGING_URL }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke tests
        run: npx playwright test e2e/smoke.spec.ts --reporter=github
        if: env.BASE_URL != ''
