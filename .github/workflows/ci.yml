name: CI — EliteDev

on:
  pull_request:
    branches: [master, main, fix/launch-blockers-security, codex/production-readiness-release, codex/accounting-invoices-crud, codex/accounting-journal-crud, codex/accounting-bank-crud]
  push:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/production-modules-completion') }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # ── Toolchain (pnpm MUST be installed before setup-node cache) ──
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.27.0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm

    - name: Verify toolchain
      run: |
        node --version
        pnpm --version
        echo "✅ Toolchain verified"

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    # ── Deploy config regression guard (REV-5: run before expensive gates) ──

    - name: Deploy config check
      run: node scripts/verify-deploy-config.mjs

    - name: Preview isolation and historical archive checks
      run: |
        node --test scripts/preview-safety.test.mjs scripts/verify-staging-history.test.mjs scripts/assert-module-test-target.test.mjs scripts/verify-driver-evidence.test.mjs scripts/verify-driver-leave-lifecycle.test.mjs scripts/verify-platform-admin-users.test.mjs scripts/coordinated-acceptance.test.mjs scripts/verify-accounting-master-crud.test.mjs scripts/verify-invoice-reference-and-pages.test.mjs scripts/retire-release-acceptance.test.mjs scripts/write-release-evidence.test.mjs scripts/acceptance-fixture-ledgers.test.mjs scripts/finance-verification-contracts.test.mjs
        node scripts/verify-staging-history.mjs

    # ── FX-10: every API route must self-guard or be explicitly allowlisted ──

    - name: API route guard check
      run: node scripts/verify-api-guards.mjs

    # ── Code quality ──────────────────────────────────────────────────────

    - name: Lint
      run: pnpm lint

    - name: Type check
      run: pnpm exec tsc --noEmit

    - name: Unit tests
      run: pnpm test

    # ── Build ─────────────────────────────────────────────────────────────

    - name: Build
      run: pnpm build
      env:
        NEXT_PUBLIC_SUPABASE_URL: http://localhost:58321
        NEXT_PUBLIC_SUPABASE_ANON_KEY: test-key
        NEXT_PUBLIC_APP_URL: http://localhost:3000
        SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
        SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

    - name: Invoice PDF runtime assets
      run: node scripts/verify-invoice-pdf-bundle.mjs

    # ── Security gates ────────────────────────────────────────────────────

    - name: Dependency audit
      run: pnpm audit --audit-level=high

    - name: Secret scan
      run: |
        echo "Scanning for hardcoded secrets..."
        # Fail ONLY on real secret shapes: a long literal assigned in code
        # (Supabase service JWTs start with eyJ, Stripe-style sk_live_/sk_test_,
        # AWS AKIA…). Bare variable-name mentions (comments, error messages,
        # process.env reads) are not secrets and must not fail the build.
        # || true keeps grep's no-match exit code from failing the step under
        # bash -eo pipefail. Only filenames are printed; matched secret values must never enter CI logs.
        MATCHES=$(grep -rlE "=[[:space:]]*['\"](eyJ[A-Za-z0-9_-]{20,}|sk_live_[A-Za-z0-9]{12,}|sk_test_[A-Za-z0-9]{12,}|AKIA[A-Z0-9]{16})['\"]" src/ --include="*.ts" --include="*.tsx" --include="*.js" || true)
        if [ -n "$MATCHES" ]; then
          echo "❌ Files requiring hardcoded-secret review:"
          echo "$MATCHES"
          exit 1
        fi
        echo "✅ No hardcoded secrets detected"

    - name: Check for sensitive files
      run: |
        if git ls-files | grep -E '\.env$|\.env\.local$|\.env\.production$|\.env\.development$'; then
          echo "❌ Environment files found in repository"
          git ls-files | grep -E '\.env$|\.env\.local$|\.env\.production$|\.env\.development$'
          exit 1
        fi
        echo "✅ No environment files in repository"


    # ── Smoke test (production build, not dev server) ─────────────────────

    - name: Smoke test readiness failure without dependencies
      run: |
        # Start production server from the build output
        PORT=3000 pnpm start > /tmp/elitedev.log 2>&1 &
        APP_PID=$!
        trap 'kill "$APP_PID" 2>/dev/null || true' EXIT

        # Wait for server to be ready
        for attempt in $(seq 1 30); do
          health="$(curl -sS http://127.0.0.1:3000/api/health 2>/dev/null || true)"
          if [ -n "$health" ]; then
            echo "✅ Server started (attempt $attempt)"
            break
          fi
          if [ "$attempt" -eq 30 ]; then
            echo "❌ Server did not start in 60 seconds"
            cat /tmp/elitedev.log | tail -20
            exit 1
          fi
          sleep 2
        done

        # Verify health response
        echo "Health response: $health"
        status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/health)
        if [ "$status" = "503" ] && printf '%s' "$health" | grep -q '"status":"unhealthy"'; then
          echo "✅ Readiness correctly fails closed without dependent services"
        else
          echo "❌ Health check failed — unexpected response"
          exit 1
        fi
      env:
        NEXT_PUBLIC_SUPABASE_URL: http://localhost:58321
        NEXT_PUBLIC_SUPABASE_ANON_KEY: test-key
        NEXT_PUBLIC_APP_URL: http://localhost:3000
        PORT: "3000"

  # ── pgTAP RLS tests (independent release gate, needs Docker) ─────────────
  pgtap:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.27.0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm

    - name: Verify toolchain
      run: |
        node --version
        pnpm --version

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Install Supabase CLI
      uses: supabase/setup-cli@v1
      with:
        version: v2.119.0

    - name: Start Supabase local stack
      run: |
        set -o pipefail
        supabase start > /tmp/supabase-start.log 2>&1 || { node scripts/report-supabase-start-failure.mjs /tmp/supabase-start.log; exit 1; }
        echo "Supabase started successfully"

    - name: Wait for database
      run: |
        # NOTE: `supabase db ping` does not exist in the Supabase CLI.
        # Probe Postgres directly via psql on the local Supabase port (58322).
        for i in $(seq 1 60); do
          if psql "postgresql://postgres:postgres@127.0.0.1:58322/postgres" -tAc "SELECT 1" 2>/dev/null | grep -q "1"; then
            echo "✅ Database is ready (attempt $i)"
            break
          fi
          if [ "$i" -eq 60 ]; then
            echo "❌ Database did not become ready"
            exit 1
          fi
          sleep 2
        done

    - name: Apply migrations + seed
      run: |
        supabase db reset 2>&1 | tail -15
        echo "✅ All migrations + seed data applied"

    - name: Install pgTAP extension
      run: |
        # MUST run AFTER `supabase db reset` — the reset recreates the database
        # from scratch and would drop an extension installed before it.
        # (Audit 2026-09-23: reversed order made every suite fail with
        # "function plan(integer) does not exist" while the runner still
        # reported the files as passed.)
        # Keep pgTAP's helper tables out of the Data API's public schema. If
        # installed in public after the migrations, Supabase default
        # privileges grant those test-only tables broad Data API privileges.
        psql "postgresql://postgres:postgres@127.0.0.1:58322/postgres" -c "CREATE EXTENSION IF NOT EXISTS pgtap WITH SCHEMA extensions;"
        echo "✅ pgTAP extension ready"

    - name: Run pgTAP RLS tests
      run: |
        echo "═══════════════════════════════════════════════════════════"
        echo " Running pgTAP RLS test suite"
        echo "═══════════════════════════════════════════════════════════"

        TOTAL=0
        PASSED=0
        FAILED=0

        for test_file in $(find supabase/tests -name "*.sql" -type f | sort); do
          filename=$(basename "$test_file")
          echo ""
          echo "▶ Running: $filename"
          echo "───────────────────────────────────────────────────────"

          # --single-transaction: SET LOCAL ROLE and request.jwt.claims must
          # persist across statements (in autocommit each statement is its
          # own transaction, so role/JWT context would evaporate and every
          # anon/authenticated assertion would run as superuser).
          # -tA: emit bare TAP lines — in psql's default table format the
          # plan/`not ok` lines are wrapped in table borders and unparseable.
          OUTPUT=$(psql "postgresql://postgres:postgres@127.0.0.1:58322/postgres" -tA --single-transaction -f "$test_file" 2>&1)
          EXIT_CODE=$?

          # A file only counts as passed when it: exited 0, emitted a TAP plan
          # (1..N — proves pgTAP is actually installed and the suite started),
          # printed zero `not ok` lines, and produced no psql ERROR lines.
          # (Audit 2026-09-23: files that aborted before the plan were counted
          # as "✅ completed", masking a broken gate for the whole suite.)
          TESTS_RUN=$(echo "$OUTPUT" | grep -oE '^1\.\.[0-9]+' | head -1 | sed -E 's/^1\.\.([0-9]+)/\1/')
          FAILURES=$(echo "$OUTPUT" | grep -c '^not ok' || true)
          PSQL_ERRORS=$(echo "$OUTPUT" | grep -cE '^psql:.*ERROR|^ERROR' || true)

          if [ "$EXIT_CODE" -ne 0 ] || [ -z "$TESTS_RUN" ] || [ "$FAILURES" -gt 0 ] || [ "$PSQL_ERRORS" -gt 0 ]; then
            TOTAL=$((TOTAL + ${TESTS_RUN:-1}))
            FAILED=$((FAILED + 1))
            echo " ❌ $filename — exit=$EXIT_CODE plan=${TESTS_RUN:-none} not_ok=$FAILURES psql_errors=$PSQL_ERRORS"
            echo "$OUTPUT" | grep -E '^not ok|^psql:.*ERROR|^ERROR' | head -8
          else
            TOTAL=$((TOTAL + TESTS_RUN))
            PASSED=$((PASSED + TESTS_RUN))
            echo " ✅ $filename — $TESTS_RUN/$TESTS_RUN passed"
          fi
        done

        echo ""
        echo "═══════════════════════════════════════════════════════════"
        echo " pgTAP Results: $PASSED/$TOTAL passed, $FAILED failed"
        echo "═══════════════════════════════════════════════════════════"

        if [ "$FAILED" -gt 0 ]; then
          echo "❌ Some pgTAP tests failed"
          exit 1
        else
          echo "✅ All pgTAP tests passed"
        fi

    - name: Verify local Auth and Storage integration
      run: node scripts/run-storage-integration.mjs

    - name: Verify payment races in disposable database
      run: node scripts/verify-payment-concurrency.mjs --local-disposable

    - name: Verify manual receivable retries in disposable database
      run: node scripts/verify-manual-receivable-concurrency.mjs --local-disposable

    - name: Verify expense creation retries in disposable database
      run: node scripts/verify-expense-creation-concurrency.mjs --local-disposable

    - name: Verify expense approval audit in disposable database
      run: node scripts/verify-expense-approval-concurrency.mjs --local-disposable

    - name: Verify accounting default initialization in disposable database
      run: node scripts/verify-accounting-defaults-concurrency.mjs --local-disposable

    - name: Verify expense decision races in disposable database
      run: node scripts/verify-expense-rejection-concurrency.mjs --local-disposable

    - name: Verify password completion and administrator reset guards
      run: node scripts/verify-password-completion.mjs --local-disposable

    - name: Verify ZATCA preparation ledger in disposable database
      run: node scripts/verify-zatca-issuance-concurrency.mjs --local-disposable

    - name: Verify invoice transaction races in owned PostgreSQL
      run: INVOICE_TEST_PG_BIN="$(pg_config --bindir)" node scripts/verify-invoice-transitions-native.mjs --local-disposable

    - name: Verify invoice journal reversal boundaries
      run: JOURNAL_TEST_PG_BIN="$(pg_config --bindir)" node scripts/verify-invoice-journal-reversal-native.mjs --local-disposable

    - name: Configure disposable browser verification
      run: |
        node --input-type=module <<'NODE'
        import { execFileSync } from 'node:child_process';
        import { writeFileSync } from 'node:fs';
        const local = JSON.parse(execFileSync('supabase', ['status', '--output', 'json'], { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] }));
        const url = new URL(local.API_URL);
        if (!['localhost', '127.0.0.1'].includes(url.hostname) || url.port !== '58321') throw new Error('Local target required');
        writeFileSync('.env.local', Object.entries({
          NEXT_PUBLIC_SUPABASE_URL: local.API_URL,
          NEXT_PUBLIC_SUPABASE_ANON_KEY: local.ANON_KEY,
          SUPABASE_SERVICE_ROLE_KEY: local.SERVICE_ROLE_KEY,
          NEXT_PUBLIC_APP_URL: 'http://localhost:3107',
        }).map(([key, value]) => `${key}=${value}`).join('\n'));
        NODE

    - name: Build and verify owner MFA in the browser
      run: |
        pnpm exec playwright install --with-deps chromium
        pnpm build
        pnpm start --port 3107 > /tmp/local-app.log 2>&1 &
        ready=0
        for i in $(seq 1 30); do
          if curl -fsS http://localhost:3107/api/health > /dev/null; then ready=1; break; fi
          sleep 2
        done
        test "$ready" = "1" || { echo "Local app dependencies are not ready"; exit 1; }
        VERIFY_PASSWORD_FLOWS=1 VERIFY_APPROVALS=1 VERIFY_EXPENSES=1 VERIFY_RECEIVABLE_CRUD=1 VERIFY_INVOICE_CRUD=1 VERIFY_JOURNAL_CRUD=1 VERIFY_BANK_CRUD=1 VERIFY_OPERATIONS_CRUD=1 VERIFY_OVERVIEWS=1 node scripts/verify-local-mfa.mjs
        node scripts/verify-invoice-print.mjs

    - name: Upload browser verification failure evidence
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: browser-verification-${{ github.sha }}-${{ github.run_attempt }}
        path: |
          supabase/.temp/**/*.png
        if-no-files-found: ignore
        retention-days: 3

    - name: Stop Supabase
      if: always()
      run: supabase stop 2>/dev/null || true

  # ── E2E tests (independent PR release gate, needs staging env) ────────────
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    env:
      BASE_URL: ${{ secrets.STAGING_URL }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.27.0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Install Playwright browsers
      run: pnpm exec playwright install --with-deps chromium

    - name: Verify E2E configuration
      run: |
        missing=0
        for var in BASE_URL TEST_USER_EMAIL TEST_USER_PASSWORD STAGING_SUPABASE_URL; do
          if [ -z "${!var}" ]; then
            echo "MISSING: $var is required for authenticated staging E2E"
            missing=1
          fi
        done
        if [ "$missing" -ne 0 ]; then
          echo "Configure the corresponding GitHub Actions secrets; E2E must not silently skip."
          exit 1
        fi
        echo "E2E staging URL and credentials are configured"

    - name: Run E2E smoke tests
      env:
        STAGING_EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha }}
      run: |
        node scripts/wait-for-staging.mjs
        pnpm exec playwright test e2e/smoke.spec.ts e2e/locale-session.spec.ts e2e/public-surface.spec.ts --reporter=github


  # Full synthetic acceptance is a separate, serialized staging mutation gate.
  staging_acceptance:
    needs: [ci, pgtap]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/production-modules-completion'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: staging-full-acceptance-production-modules-completion
      cancel-in-progress: false
    env:
      VERIFY_APP_URL: ${{ secrets.STAGING_URL }}
      VERIFY_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
    steps:
    - name: Checkout exact trusted PR head
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        persist-credentials: false

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.27.0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Install Playwright Chromium
      run: pnpm exec playwright install --with-deps chromium

    - name: Validate isolated configuration and allocate owned run
      id: acceptance_config
      env:
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      run: |
        node --input-type=module <<'NODE'
        import fs from 'node:fs';
        import { randomUUID } from 'node:crypto';
        import { assertAcceptanceTarget } from './scripts/lib/coordinated-acceptance.mjs';
        const required = ['VERIFY_APP_URL','VERIFY_COMMIT_SHA','NEXT_PUBLIC_SUPABASE_URL','NEXT_PUBLIC_SUPABASE_ANON_KEY','SUPABASE_SERVICE_ROLE_KEY'];
        if (required.some(key => !process.env[key] || /[\r\n]/.test(process.env[key]))) throw Error('Complete isolated staging configuration required before fixtures');
        assertAcceptanceTarget(process.env.NEXT_PUBLIC_SUPABASE_URL, process.env.VERIFY_APP_URL, process.env.VERIFY_COMMIT_SHA);
        const runId = randomUUID();
        fs.mkdirSync('supabase/.temp', { recursive: true });
        const values = Object.fromEntries(required.map(key => [key, process.env[key]]));
        fs.writeFileSync('supabase/.temp/staging-verification.env', Object.entries(values).map(([key,value]) => key+'='+JSON.stringify(value)).join('\n')+'\n', { flag:'wx', mode:0o600 });
        fs.appendFileSync(process.env.GITHUB_ENV, 'VERIFY_RELEASE_RUN_ID='+runId+'\n');
        fs.appendFileSync(process.env.GITHUB_OUTPUT, 'run_id='+runId+'\n');
        console.log(JSON.stringify({ check:'allocated owned staging run', runId }));
        NODE

    - name: Run all nine unchanged staging acceptance groups
      id: acceptance_process
      timeout-minutes: 70
      run: |
        node --input-type=module <<'NODE'
        import fs from 'node:fs';
        import { spawn } from 'node:child_process';
        import { setTimeout as delay } from 'node:timers/promises';
        if (process.platform !== 'linux') throw Error('Linux acceptance process isolation required');
        const child = spawn(process.execPath, ['scripts/verify-production-modules.mjs'], { detached:true, stdio:'inherit' });
        let stopping = false;
        const stop = async code => {
          if (stopping) return;
          stopping = true;
          let drained = false;
          try {
            if (!Number.isSafeInteger(child.pid) || child.pid < 2) throw Error('Owned acceptance process group unavailable');
            const group = -child.pid;
            const alive = () => {
              try { process.kill(group, 0); return true; }
              catch (error) { if (error.code === 'ESRCH') return false; throw error; }
            };
            if (alive()) process.kill(group, 'SIGTERM');
            for (let attempt = 0; attempt < 20 && alive(); attempt++) await delay(100);
            if (alive()) process.kill(group, 'SIGKILL');
            for (let attempt = 0; attempt < 20 && alive(); attempt++) await delay(100);
            if (alive()) throw Error('Owned acceptance process group did not stop');
            drained = true;
          } catch {
            console.error('Owned acceptance process group retirement unverified');
            code = 1;
          }
          if (drained) fs.appendFileSync(process.env.GITHUB_OUTPUT, 'drained=true\n');
          process.exit(code);
        };
        process.once('SIGINT', () => { void stop(130); });
        process.once('SIGTERM', () => { void stop(143); });
        child.once('error', () => { void stop(1); });
        child.once('exit', code => { void stop(code ?? 1); });
        NODE

    - name: Retire every recorded actor for this exact owned run
      id: acceptance_cleanup
      if: always() && steps.acceptance_config.outputs.run_id != ''
      timeout-minutes: 10
      env:
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        ACCEPTANCE_PROCESS_DRAINED: ${{ steps.acceptance_process.outputs.drained }}
      run: |
        if [ "$ACCEPTANCE_PROCESS_DRAINED" != "true" ]; then
          echo 'Owned acceptance process group retirement unverified'
          exit 1
        fi
        node scripts/retire-release-acceptance.mjs

    - name: Upload projected acceptance evidence
      if: always() && steps.acceptance_cleanup.outputs.artifact_dir != ''
      uses: actions/upload-artifact@v4
      with:
        name: staging-acceptance-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
        path: ${{ steps.acceptance_cleanup.outputs.artifact_dir }}
        if-no-files-found: warn
        retention-days: 7
        include-hidden-files: false
