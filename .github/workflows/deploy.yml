name: Deploy — EliteDev

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Only allow one deployment at a time per branch
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  # ── Preview deployment (PRs) ──────────────────────────────────────────────
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm i -g vercel

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy preview
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "🔗 Preview URL: $URL"

      - name: Smoke test preview
        run: |
          if [ -n "${{ steps.deploy.outputs.url }}" ]; then
            sleep 10
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.deploy.outputs.url }}/api/health" 2>/dev/null || echo "000")
            echo "Health check: $STATUS"
            if [ "$STATUS" != "200" ]; then
              echo "⚠️ Preview health check returned $STATUS"
              # Don't fail — preview may not have all env vars
            fi
          fi

  # ── Production deployment ─────────────────────────────────────────────────
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm i -g vercel

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy production
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "🚀 Production URL: $URL"

      - name: Post-deploy verification
        run: |
          sleep 15
          echo "Running post-deploy smoke tests..."

          # Health check
          HEALTH=$(curl -s "${{ steps.deploy.outputs.url }}/api/health" 2>/dev/null || echo "{}")
          echo "Health: $HEALTH"

          if echo "$HEALTH" | grep -q '"status":"healthy"'; then
            echo "✅ Health check passed"
          else
            echo "❌ Health check failed — consider rollback"
            exit 1
          fi

          # Security headers
          HEADERS=$(curl -s -I "${{ steps.deploy.outputs.url }}/landing" 2>/dev/null || echo "")
          if echo "$HEADERS" | grep -qi "x-frame-options"; then
            echo "✅ Security headers present"
          else
            echo "⚠️ Missing security headers"
          fi

          # Auth boundary
          REDIRECT=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.deploy.outputs.url }}/dashboard" 2>/dev/null || echo "000")
          if [ "$REDIRECT" = "307" ] || [ "$REDIRECT" = "302" ] || [ "$REDIRECT" = "401" ]; then
            echo "✅ Auth boundary working (redirect $REDIRECT)"
          else
            echo "⚠️ Auth boundary returned $REDIRECT"
          fi

          echo "🎉 Post-deploy verification complete"
