# EliteDev — Supabase CLI Configuration
# Used by: supabase start (local dev), supabase test (pgTAP), CI pipeline

project_id = "elite-release-20261012"

[api]
enabled = true
port = 58321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 58322
shadow_port = 58320
major_version = 17

[db.pooler]
enabled = false

[studio]
enabled = true
port = 58323
api_url = "http://localhost"

[local_smtp]
enabled = true
port = 58324
smtp_port = 58325
pop3_port = 58326

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# Privileged users must be able to enroll and verify the required second factor.
# These settings configure the disposable local stack, not the hosted project.
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# ── Storage ──────────────────────────────────────────────────────
[storage]
enabled = true
file_size_limit = "50MiB"

# ── Realtime ─────────────────────────────────────────────────────
[realtime]
enabled = true

# ── Database secrets (local only — never commit production values) ──
